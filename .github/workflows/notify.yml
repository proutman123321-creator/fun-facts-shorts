# Every 30 minutes around the posting times: asks Zernio whether the scheduled videos went live
# and sends a Telegram message (published with links, or the problem). Takes about 20 seconds.
name: Check posts and alert on Telegram

on:
  schedule:
    # Posts go out ~17:00, ~21:30 and ~02:00 Paris (+-35 min) for the English-speaking audience:
    # 11:00, 15:30 and 20:00 New York; 16:00, 20:30 and 01:00 London. In UTC (summer / winter), with the 2 h
    # wait for a late post: 14:25-17:40, 18:55-22:40 and 23:25-03:35. 06:15 UTC catches anything left.
    - cron: "*/30 0-3,14-23 * * *"
    - cron: "15 6 * * *"
  workflow_dispatch:     # "Run workflow" button; "test" sends a Telegram test message from GitHub
    inputs:
      mode:
        description: "check = check the posts | test = send a Telegram test message"
        default: check
        type: choice
        options: [check, test]

permissions:
  contents: write  # to save notified.json (posts already reported)

concurrency:
  group: post-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Check the posts and send alerts
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}  # empty until set: config.json is used instead
          MODE: ${{ github.event.inputs.mode || 'check' }}
        run: |
          if [ "$MODE" = "test" ]; then
            python3 src/notify.py test | grep -q '^sent' || { echo "Telegram test message NOT sent"; exit 1; }
          else
            python3 src/notify.py check
          fi

      - name: Remember which posts were reported
        run: |
          git config user.name "fun-facts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notified.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "Reported posts $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && exit 0; sleep 5; done
          exit 1
