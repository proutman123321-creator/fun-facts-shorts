# Runs every day on GitHub's computers: makes the videos and sends them to Zernio.
# Your PC does not need to be on. Keys come from the repository's Secrets.
name: Daily fun facts videos

on:
  schedule:
    - cron: "7 2 * * *"   # 02:07 UTC = 03:07 Paris in winter, 04:07 in summer: early, because GitHub often starts 30-60 min late
    - cron: "37 4 * * *"   # backup in case GitHub skipped the first one; it skips slots already sent today
  workflow_dispatch:     # "Run workflow" button for tests
    inputs:
      mode:
        description: "run = make + send | no-publish = only make the videos | dry-run = make + show what would be sent"
        default: no-publish
        type: choice
        options: [no-publish, dry-run, run]

permissions:
  contents: write  # to save state.json (which topics were used)

concurrency:
  group: daily-videos
  cancel-in-progress: false

jobs:
  videos:
    runs-on: ubuntu-24.04  # fixed version: "latest" moves to new Ubuntu releases that could break the setup
    timeout-minutes: 90   # the AI voice adds a few minutes per video
    steps:
      # always the latest main (not the commit from when the run was queued), so a backup run
      # sees the state.json saved by the run before it; a manual test run uses the branch it was started on
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # the AI voice needs torch 2.6, which stops at Python 3.13
          cache: pip

      - name: Install FFmpeg and Python packages
        run: |
          # Ubuntu's package servers sometimes fail for a minute (exit code 100): try 3 times before giving up
          for i in 1 2 3; do
            sudo apt-get update -q && sudo apt-get install -y -q -o Acquire::Retries=3 ffmpeg && break
            [ $i = 3 ] && exit 1
            sleep 30
          done
          # CPU build of torch for the AI voice (GitHub has no graphics card; the CUDA build is 2 GB bigger)
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -c constraints.txt   # constraints.txt = exact versions of a run that worked

      - name: Reuse the AI voice models (downloaded on the first run only)
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: voice-models-v1

      - name: Reuse downloaded stock clips
        uses: actions/cache@v6
        with:
          path: assets/clips
          key: clips-${{ github.run_id }}
          restore-keys: clips-

      - name: Make and send the videos
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}  # empty until set: config.json is used instead
          MODE: ${{ github.event.inputs.mode || 'run' }}
        run: |
          case "$MODE" in
            run) python src/run_daily.py ;;
            dry-run) python src/run_daily.py --dry-run ;;
            *) python src/run_daily.py --no-publish ;;
          esac

      # if the job broke before the script could send its own Telegram alert (e.g. install failure)
      - name: Telegram alert if the job failed
        if: failure() && hashFiles('telegram-alert-sent') == ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}  # empty until set: config.json is used instead
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_CHAT_ID" ] || TELEGRAM_CHAT_ID=$(python3 -c "import json;print(json.load(open('config.json')).get('telegram_chat_id',''))")
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || exit 0
          curl -s -o /dev/null "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$(printf '🟨 FUN FACTS FOR REAL\n❌ Le job vidéo GitHub a échoué. Détails : %s' "$RUN_URL")"

      # 3 days is enough to look at a video again (~100 MB of videos a day; the repository is public, storage is free)
      - name: Keep the videos for 3 days (Actions page > this run > Artifacts)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: videos
          path: |
            output/*/video.mp4
            output/*/info.json
            run-log.txt
          retention-days: 3
          if-no-files-found: ignore

      # runs even if the job failed halfway, so a video that was already sent is never sent again
      - name: Save which topics were used
        if: always() && (github.event.inputs.mode || 'run') == 'run'
        run: |
          git config user.name "fun-facts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json posts_log.jsonl 2>/dev/null || git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "Used topics $(date -u +%F)"
          # the weekly writing task may have pushed new topics meanwhile
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && exit 0; sleep 5; done
          exit 1
